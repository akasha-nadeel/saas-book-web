<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenChapter — carousel slides</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b0e14; color:#f1f2fa;
         font:15px/1.5 "Segoe UI", system-ui, sans-serif; padding:28px; }
  h1 { font-size:19px; margin:0 0 4px; font-weight:600; }
  p.sub { margin:0 0 20px; color:#bcc5de; font-size:14px; max-width:70ch; }
  button { background:#8ab4ff; color:#08122e; border:0; border-radius:10px;
           padding:11px 18px; font:600 14px "Segoe UI",system-ui,sans-serif;
           cursor:pointer; margin-right:8px; }
  button.ghost { background:#1e252e; color:#f1f2fa; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
          gap:20px; margin-top:24px; }
  .card { background:#13171e; border:1px solid #262c38; border-radius:12px; padding:10px; }
  .card canvas { width:100%; height:auto; display:block; border-radius:6px; }
  .row { display:flex; align-items:center; justify-content:space-between;
         margin-top:8px; font-size:12px; color:#bcc5de; }
  .row button { padding:5px 10px; font-size:12px; margin:0; }
</style>
</head>
<body>
<h1>OpenChapter — "Which file is your book?" carousel</h1>
<p class="sub">1080 &times; 1350 (4:5, the tallest size Instagram allows in feed). Click <b>Download all 8</b>, then upload them in order. Chrome asks once to allow multiple downloads — say yes.</p>
<button id="all">Download all 8</button>
<button class="ghost" id="redraw">Redraw</button>
<div class="grid" id="grid"></div>

<script>
var W = 1080, H = 1350, PAD = 96;
var C = { surface:"#13171e", panel:"#070a11", raised:"#1e252e", line:"#262c38",
          fg:"#f1f2fa", muted:"#bcc5de", accent:"#8ab4ff", ink:"#08122e",
          stop:"#f87171", wordmark:"#aab4d6" };
var SERIF = 'Georgia, "Times New Roman", serif';
var SANS  = '"Segoe UI", system-ui, -apple-system, sans-serif';
var MONO  = 'Consolas, "Courier New", monospace';

function font(size, family, weight) { return (weight || 400) + " " + size + "px " + family; }

function wrap(ctx, text, maxW) {
  var words = text.split(" "), out = [], line = "";
  for (var i = 0; i < words.length; i++) {
    var t = line ? line + " " + words[i] : words[i];
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = words[i]; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}

// Draws a paragraph. Returns the y to start the next block at.
function para(ctx, o) {
  ctx.font = font(o.size, o.family || SERIF, o.weight);
  ctx.fillStyle = o.color || C.fg;
  var lh = o.lh || Math.round(o.size * 1.28);
  var x = o.x || PAD;
  var ls = wrap(ctx, o.text, o.maxW || (W - PAD * 2));
  var y = o.y;
  for (var i = 0; i < ls.length; i++) { ctx.fillText(ls[i], x, y); y += lh; }
  return y - lh + (o.gap === undefined ? lh : o.gap);
}

function kicker(ctx, text) {
  ctx.font = font(24, SANS, 600);
  ctx.fillStyle = C.muted;
  var x = PAD, s = text.toUpperCase();
  for (var i = 0; i < s.length; i++) {
    ctx.fillText(s[i], x, PAD + 34);
    x += ctx.measureText(s[i]).width + 4;
  }
  ctx.fillStyle = C.accent;
  ctx.fillRect(PAD, PAD + 58, 64, 4);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function footer(ctx, i) {
  var y = H - 74;
  ctx.font = font(26, SANS, 600);
  ctx.fillStyle = C.fg;
  ctx.fillText("Open", PAD, y);
  var w = ctx.measureText("Open").width;
  ctx.fillStyle = C.wordmark;
  ctx.fillText("Chapter", PAD + w, y);
  var n = 8, d = 9, gap = 16;
  var x = W - PAD - ((n - 1) * gap + d);
  for (var k = 0; k < n; k++) {
    ctx.beginPath();
    ctx.arc(x + k * gap, y - 9, d / 2, 0, Math.PI * 2);
    ctx.fillStyle = k === i ? C.accent : C.line;
    ctx.fill();
  }
}

function base(ctx) {
  ctx.fillStyle = C.surface;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";
}

/* -------------------------------- slides --------------------------------- */
var slides = [

// 1 - hook
function (ctx) {
  kicker(ctx, "The folder");
  var y = 480;
  y = para(ctx, { text: "Open the folder where your book lives.", y: y, size: 82, lh: 100, gap: 175 });
  para(ctx, { text: "Count how many files claim to be the book.", y: y, size: 82, lh: 100, color: C.accent });
},

// 2 - the file list
function (ctx) {
  kicker(ctx, "Sound familiar?");
  var files = ["novel_draft.docx", "novel_draft2.docx", "novel_FINAL.docx",
               "novel_FINAL_edited.docx", "novel_FINAL_v3_REAL.docx",
               "novel_FINAL_use_this_one.docx"];
  var cardY = 250, cardH = 560;
  ctx.fillStyle = C.panel;
  roundRect(ctx, PAD, cardY, W - PAD * 2, cardH, 22);
  ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
  var y = cardY + 96;
  for (var i = 0; i < files.length; i++) {
    var last = i === files.length - 1;
    ctx.fillStyle = last ? C.accent : C.muted;
    ctx.font = font(38, MONO, last ? 700 : 400);
    ctx.fillText(files[i], PAD + 48, y);
    y += 78;
  }
  para(ctx, { text: "Every writer has this folder.", y: 960, size: 66, lh: 82 });
},

// 3 - name the real problem
function (ctx) {
  kicker(ctx, "The real cost");
  var y = 420;
  y = para(ctx, { text: "The problem isn’t that it’s messy.", y: y, size: 70, lh: 88, color: C.muted, gap: 165 });
  para(ctx, { text: "It’s that you no longer know which one is your book.", y: y, size: 82, lh: 100 });
},

// 4 - the consequence
function (ctx) {
  kicker(ctx, "What it does");
  var y = 430;
  y = para(ctx, { text: "So you stop opening the folder.", y: y, size: 74, lh: 92, gap: 168 });
  para(ctx, { text: "And a book you’re afraid to open is a book you’ve stopped writing.", y: y, size: 74, lh: 92, color: C.accent });
},

// 5 - why it happens
function (ctx) {
  kicker(ctx, "Why it happens");
  var y = 330;
  y = para(ctx, { text: "It isn’t laziness.", y: y, size: 54, lh: 68, color: C.muted, gap: 128 });
  y = para(ctx, { text: "You never edit the book. You edit a copy, because overwriting the old one feels like it could cost you something good.", y: y, size: 58, lh: 78, gap: 148 });
  ctx.fillStyle = C.accent;
  ctx.fillRect(PAD, y - 48, 5, 250);
  para(ctx, { text: "Fear of losing a version is what makes you keep all of them. Keeping all of them is how you lose the real one.", x: PAD + 42, maxW: W - PAD * 2 - 42, y: y, size: 58, lh: 78, color: C.accent });
},

// 6 - the stakes
function (ctx) {
  kicker(ctx, "The ordinary Tuesday");
  var y = 310;
  y = para(ctx, { text: "Writers lose work to this every week. Not to drama.", y: y, size: 60, lh: 78, gap: 150 });
  var items = ["A laptop and the backup drive dying in the same power cut.",
               "A corrupted disk taking half a novel.",
               "Two weeks of edits made to a file that turned out to be last month’s copy."];
  for (var i = 0; i < items.length; i++) {
    ctx.fillStyle = C.stop;
    ctx.font = font(48, SANS, 700);
    ctx.fillText("—", PAD, y);
    y = para(ctx, { text: items[i], x: PAD + 62, maxW: W - PAD * 2 - 62, y: y, size: 50, lh: 68, color: C.muted, gap: 138 });
  }
},

// 7 - the fix
function (ctx) {
  kicker(ctx, "Ten minutes");
  var steps = [
    ["One live file.", "Named after your book. No dates, no v2, no FINAL."],
    ["Archive by folder.", "Before a big rewrite, copy it into a dated folder, then rewrite the live one."],
    ["Dates go in folder names.", "Never in the file name."],
    ["One backup off the machine.", "If it only exists where you type, it doesn’t exist."]
  ];
  var y = 290;
  for (var i = 0; i < steps.length; i++) {
    ctx.fillStyle = C.accent;
    ctx.font = font(44, SERIF, 700);
    ctx.fillText(String(i + 1), PAD, y);
    y = para(ctx, { text: steps[i][0], x: PAD + 62, maxW: W - PAD * 2 - 62, y: y, size: 52, lh: 66, gap: 62 });
    y = para(ctx, { text: steps[i][1], x: PAD + 62, maxW: W - PAD * 2 - 62, y: y, size: 40, lh: 56, color: C.muted, family: SANS, gap: 132 });
  }
},

// 8 - close and CTA
function (ctx) {
  kicker(ctx, "In one line");
  var y = 400;
  y = para(ctx, { text: "You don’t need a better filing system.", y: y, size: 62, lh: 80, color: C.muted, gap: 172 });
  y = para(ctx, { text: "You need one file you’re not afraid to open.", y: y, size: 82, lh: 100, gap: 190 });
  var bw = W - PAD * 2, bh = 190;
  ctx.fillStyle = C.raised;
  roundRect(ctx, PAD, y, bw, bh, 20);
  ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
  para(ctx, { text: "How many files does your book have right now? Be honest ↓", x: PAD + 44, maxW: bw - 88, y: y + 76, size: 44, lh: 60, color: C.accent, family: SANS, weight: 600 });
}
];

/* ------------------------------- rendering -------------------------------- */
var grid = document.getElementById("grid");
var canvases = [];

function render() {
  grid.innerHTML = "";
  canvases.length = 0;
  for (var i = 0; i < slides.length; i++) {
    (function (i) {
      var cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      var ctx = cv.getContext("2d");
      base(ctx);
      slides[i](ctx);
      footer(ctx, i);
      var card = document.createElement("div");
      card.className = "card";
      var row = document.createElement("div");
      row.className = "row";
      var label = document.createElement("span");
      label.textContent = "Slide " + (i + 1);
      var b = document.createElement("button");
      b.textContent = "PNG";
      b.onclick = function () { save(cv, i); };
      row.appendChild(label); row.appendChild(b);
      card.appendChild(cv); card.appendChild(row);
      grid.appendChild(card);
      canvases.push(cv);
    })(i);
  }
}

function save(cv, i) {
  cv.toBlob(function (blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "openchapter-slide-" + (i + 1 < 10 ? "0" : "") + (i + 1) + ".png";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }, "image/png");
}

document.getElementById("all").onclick = function () {
  for (var i = 0; i < canvases.length; i++) {
    (function (i) { setTimeout(function () { save(canvases[i], i); }, i * 350); })(i);
  }
};
document.getElementById("redraw").onclick = render;

if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
else render();
</script>
</body>
</html>
